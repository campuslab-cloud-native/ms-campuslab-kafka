asyncapi: 2.6.0
info:
  title: CampusLab - Eventos Kafka
  version: 1.3.0
  description: >-
    Contrato de los flujos Kafka implementados. Bookings publica eventos de
    reserva; Audit los consume y publica los eventos derivados de auditoría.

defaultContentType: application/json

servers:
  local:
    url: localhost:9092
    protocol: kafka
    description: >-
      Listener externo del Compose local. Dentro de Docker se usan los
      listeners internos kafka1:29092, kafka2:29092 y kafka3:29092.

channels:
  bookings.events:
    description: Eventos del ciclo de vida de las reservas; clave de partición bookingId.
    bindings:
      kafka:
        partitions: 3
        replicas: 3
        topicConfiguration:
          cleanup.policy: [delete]
          retention.ms: 604800000
        bindingVersion: '0.4.0'
    publish:
      operationId: publishBookingEvent
      summary: Publicar evento desde ms-campuslab-bookings.
      message:
        $ref: '#/components/messages/BookingEvent'
    subscribe:
      operationId: consumeBookingEvent
      summary: Consumir desde ms-campuslab-audit.
      description: 'Consumer group configurado: campuslab-audit.'
      message:
        $ref: '#/components/messages/BookingEvent'

  audit.timeline:
    description: Eventos de auditoría publicados por ms-campuslab-audit; clave bookingId.
    bindings:
      kafka:
        partitions: 3
        replicas: 3
        topicConfiguration:
          cleanup.policy: [delete]
          retention.ms: 604800000
        bindingVersion: '0.4.0'
    publish:
      operationId: publishAuditEvent
      summary: Publicar evento derivado desde ms-campuslab-audit.
      description: No hay consumidor de este tópico en los repositorios actuales.
      message:
        $ref: '#/components/messages/AuditEvent'

components:
  messages:
    BookingEvent:
      name: BookingEvent
      title: Evento de reserva
      contentType: application/json
      description: Evento de creación o cambio de estado de una reserva.
      payload:
        type: object
        required:
          - eventId
          - type
          - bookingId
          - timestamp
        properties:
          eventId:
            type: string
          type:
            type: string
            enum:
              - BOOKING_CREATED
              - BOOKING_APPROVED
              - BOOKING_PREPARING
              - BOOKING_IN_USE
              - BOOKING_RETURNED
              - BOOKING_CANCELLED
          bookingId:
            type: integer
            format: int64
          resourceId:
            type: integer
            format: int64
          userId:
            type: string
          timestamp:
            type: string
            format: date-time
          traceId:
            type: string
          correlationId:
            type: string

    AuditEvent:
      name: AuditEvent
      title: Evento de auditoría
      contentType: application/json
      payload:
        type: object
        required:
          - eventId
          - bookingId
          - type
          - timestamp
        properties:
          eventId:
            type: string
          bookingId:
            type: integer
            format: int64
          userId:
            type: string
          type:
            type: string
          timestamp:
            type: string
            format: date-time
          source:
            type: string
          traceId:
            type: string
          correlationId:
            type: string
